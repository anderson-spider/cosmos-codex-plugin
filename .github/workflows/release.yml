name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

# A single publisher processes the latest main, including commits accumulated
# while a previous release was running. Never interrupt an active publication.
concurrency:
  group: cosmos-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python3 -m unittest discover -s demo-cosmos -v
      - name: Publish semantic release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-manifest:
    needs: release
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'
      - name: Reconcile source manifest with the latest release
        id: reconcile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release=$(gh api "repos/$GH_REPO/releases/latest")
          tag=$(jq -r 'select(.draft == false and .prerelease == false) | .tag_name' <<<"$release")
          test "$tag" != "null"
          asset=$(jq -r --arg name "cosmos-${tag#v}.zip" '.assets[] | select(.name == $name) | .name' <<<"$release")
          test "$asset" = "cosmos-${tag#v}.zip"
          gh auth setup-git
          git fetch --force --tags origin
          git show-ref --verify --quiet "refs/tags/$tag"
          git merge-base --is-ancestor "$tag^{}" origin/main
          git switch --detach origin/main
          version=${tag#v}
          node scripts/sync-release-manifest.mjs "$version"
          if git diff --quiet -- plugins/cosmos/.codex-plugin/plugin.json; then
            echo "Manifest already matches $tag."
            echo "Source manifest already matches $tag." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add plugins/cosmos/.codex-plugin/plugin.json
          git diff --cached --check
          git commit -m "chore(release): sync manifest to $version" \
            -m "Align the source plugin manifest with the published $tag package."
          git push origin HEAD:refs/heads/main
          printf 'Pushed source manifest version `%s` to `main` after release `%s`.\n' "$version" "$tag" >> "$GITHUB_STEP_SUMMARY"
